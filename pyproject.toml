[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymc2"
version = "0.1.0"
description = "Python MechCommander 2 tactical gameplay reimplementation (learning project, non-commercial)"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "mypy>=1.14",
    "Pillow>=11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
pythonpath = ["tests"]  # tests/helpers（合成 .pak fixture）以 helpers.* 导入；存量测试导入方式不变

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# 全局 exclude（file_resolver 层）：lint 与 format 同时生效。
# 注意不能只写在 [tool.ruff.lint]——ruff 0.17.5 的 [tool.ruff.format].exclude
# 存在失效问题（连 .py 都不排除），format 会重排 MD 文档内嵌 Python 代码块。
exclude = ["assets", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
