[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymc2"
version = "0.1.0"
description = "Python MechCommander 2 tactical gameplay reimplementation (learning project, non-commercial)"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "mypy>=1.14",
    "Pillow>=11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
exclude = ["assets", "docs"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
